[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid_reliability"
version = "0.1.0"
description = "Pipeline and analysis tools for regional electricity grid reliability and weather data"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "requests>=2.28.0",
  "psycopg>=2.9.0",
]
 
[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "mypy>=1.0.0",
  "ruff>=0.2.0",
  "black>=23.0.0",
  "pre-commit>=3.0.0",
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true